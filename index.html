<!DOCTYPE html>
<html manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PS Torghabeh</title>
    <link rel="stylesheet" href="style.css">
    <script>
    if (window.applicationCache && window.applicationCache.status == 0) {
        window.location.replace("cache.html");
    }
    </script>
</head>
<body>
<main class="card">
    <img class="logo" src="logo.png" alt="GoldHEN">
    <div class="eyebrow">PS Torghabeh</div>
    <h1 class="title">PS4 WebKit Jailbreak</h1>
    <div class="subtitle">FIRMWARE 13.02 &mdash; 13.52</div>
    <div class="fw-badge" id="fwbadge">GOLDHEN v2.4b18.11</div>
    <div class="progress-wrap" id="progress-wrap">
        <div class="progress-info">
            <span id="progress-label">Initializing...</span>
            <span id="progress-pct"></span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
    <h1 id="msgs">Loading GoldHEN v2.4b18.11... Please Wait</h1>
</main>
<script>
(function () {
    function $(id) { return document.getElementById(id); }

    var params = new URLSearchParams(location.search);

    // Firmwares with measured kernel table — KEEP IN SYNC with ps4_offsets.js
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var ua = navigator.userAgent.match(/PlayStation 4[ \/]([\d.]+)/i);
    if (ua) {
        $("fwbadge").innerHTML = "FW " + ua[1] + " &middot; GOLDHEN v2.4b18.11";
    }

    var forced    = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    var pct = 0;
    var fill = $("progress-fill");
    var num  = $("progress-pct");
    var label = $("progress-label");
    var stopped = false;

    var target = "jb.html" + location.search;

    function go() {
        $("msgs").innerHTML = "Loading exploit...";
        label.innerHTML = "Launching exploit...";
        location.replace(target);
    }

    function waitForTap(msg, action) {
        $("msgs").innerHTML = msg;
        function fire() {
            window.removeEventListener("click",   fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click",   fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        fill.className = "progress-fill error";
        fill.style.width = "100%";
        num.innerHTML = "";
        label.innerHTML = "Error";
        $("msgs").innerHTML = 'Unsupported Firmware: <span style="color: red;">' + (key || "unknown") + '</span>';
        waitForTap("Tap / press X to run anyway", go);
        return;
    }

    var timer = setInterval(function () {
        if (stopped) { clearInterval(timer); return; }
        if (pct < 90) {
            pct += 3;
            fill.style.width = pct + "%";
            num.innerHTML = pct + "%";
        }
    }, 400);

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        stopped = true;
        fill.className = "progress-fill success";
        fill.style.width = "100%";
        num.innerHTML = "100%";
        label.innerHTML = "Offline — running from cache";
        $("msgs").innerHTML = "Running from cache...";
        go();
    } else if (ac.status === ac.IDLE) {
        stopped = true;
        fill.className = "progress-fill success";
        fill.style.width = "100%";
        num.innerHTML = "100%";
        label.innerHTML = "Done!";
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        stopped = true;
        fill.className = "progress-fill success";
        fill.style.width = "100%";
        num.innerHTML = "100%";
        label.innerHTML = "Update ready";
        waitForTap("UPDATE READY — tap / press X to reload", function () { location.reload(); });
    } else {
        label.innerHTML = "Checking cache...";
        ac.addEventListener("downloading", function () {
            label.innerHTML = "Caching for offline (first run)...";
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var p = Math.round((e.loaded / e.total) * 100);
                fill.style.width = p + "%";
                num.innerHTML = p + "%";
                label.innerHTML = "Installing Offline Cache: " + p + "%";
            }
        }, false);
        ac.addEventListener("cached", function () {
            stopped = true;
            fill.className = "progress-fill success";
            fill.style.width = "100%";
            num.innerHTML = "100%";
            label.innerHTML = "Cache installation complete!";
            $("msgs").innerHTML = "Cache Installed Successfully &#10004;";
            waitForTap("CACHED — tap / press X to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            stopped = true;
            fill.className = "progress-fill success";
            fill.style.width = "100%";
            num.innerHTML = "100%";
            label.innerHTML = "Update ready";
            waitForTap("UPDATE READY — tap / press X to reload", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            stopped = true;
            fill.className = "progress-fill success";
            fill.style.width = "100%";
            num.innerHTML = "100%";
            label.innerHTML = "Done!";
            go();
        }, false);
        ac.addEventListener("error", function () {
            stopped = true;
            fill.className = "progress-fill error";
            fill.style.width = "100%";
            num.innerHTML = "";
            label.innerHTML = "Error";
            $("msgs").innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
        }, false);
        ac.addEventListener("obsolete", function () {
            stopped = true;
            fill.className = "progress-fill error";
            fill.style.width = "100%";
            num.innerHTML = "";
            label.innerHTML = "Error";
            waitForTap("CACHE OBSOLETE — tap / press X to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
