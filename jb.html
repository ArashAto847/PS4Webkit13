<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PS Torghabeh</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ?log=1 — full step log */
        #wrap {
            display: none;
        }
        body.log #wrap {
            display: block;
            margin-top: 22px;
            text-align: left;
        }
        body.log #progress-wrap {
            display: none;
        }
        #state {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #e8ecf4;
        }
        #out {
            white-space: pre-wrap;
            font: 12px/1.45 Consolas, monospace;
            background: #0b0e17;
            border: 1px solid #232b40;
            border-radius: 10px;
            padding: 10px 12px;
            height: calc(100vh - 340px);
            overflow-y: auto;
            color: #c8ced8;
        }
        .ok     { color: #22c96d; }
        .bad    { color: #e05252; }
        .warn   { color: #d8c07f; }
        .safe   { color: #22c96d; }
        .danger { color: #e05252; }
        code    { color: #9fb4ff; }
    </style>
</head>
<body>
<main class="card">
    <img class="logo" src="logo.png" alt="GoldHEN">
    <div class="eyebrow">PS Torghabeh</div>
    <h1 class="title">PS4 WebKit Jailbreak</h1>
    <div class="subtitle">FIRMWARE 13.02 &mdash; 13.52</div>
    <div class="fw-badge" id="fwbadge">GOLDHEN v2.4b18.11</div>
    <div class="progress-wrap" id="progress-wrap">
        <div class="progress-info">
            <span id="progress-label">Initializing...</span>
            <span id="progress-pct"></span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
    <div id="wrap">
        <div id="state"></div>
        <div id="out"></div>
    </div>
</main>
<script>
(function () {
    var ua = navigator.userAgent.match(/PlayStation 4[ \/]([\d.]+)/i);
    if (ua) {
        document.getElementById("fwbadge").innerHTML = "FW " + ua[1] + " &middot; GOLDHEN v2.4b18.11";
    }

    var pct = 0;
    var fill  = document.getElementById("progress-fill");
    var num   = document.getElementById("progress-pct");
    var label = document.getElementById("progress-label");

    var timer = setInterval(function () {
        var cls = document.body.className;

        // Mirror whatever jb.js wrote into #state as the progress label
        var stateEl = document.getElementById("state");
        if (stateEl && stateEl.textContent) {
            label.innerHTML = stateEl.textContent;
        }

        if (cls === "done") {
            fill.className = "progress-fill success";
            fill.style.width = "100%";
            num.innerHTML = "100%";
            label.innerHTML = "Done!";
            clearInterval(timer);
        } else if (cls === "fail") {
            fill.className = "progress-fill error";
            fill.style.width = "100%";
            num.innerHTML = "";
            clearInterval(timer);
        } else if (cls !== "log" && pct < 90) {
            pct += 3;
            fill.style.width = pct + "%";
            num.innerHTML = pct + "%";
        }
    }, 400);
})();
</script>
<script type="module">
    import "./jb.js?v=10";
</script>
</body>
</html>
